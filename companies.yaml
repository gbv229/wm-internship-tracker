# Companies tracked by the scraper.
#
# tracks: which sections of the site a firm appears in: [wealth], [real_estate], or both.
#   Defaults to [wealth].
#
# focus:
#   wealth / real_estate -> the whole firm is in that business: every internship counts
#     (except clearly unrelated roles like software, HR or maintenance)
#   mixed  -> big firm with many divisions: only roles that mention wealth,
#             private banking, private client, financial advisor, etc. count
#
# sources (one or more per company):
#   workday:     {host, tenant, site}      e.g. ms.wd5.myworkdayjobs.com / ms / External
#   oracle:      {host, site}              Oracle Recruiting Cloud
#   icims:       {host}                    e.g. career-schwab.icims.com
#   greenhouse:  {board}
#   lever:       {site}
#   ashby:       {board}
#   smartrecruiters: {company}
#   page:        {url}   no job feed; the page is checked for changes and the
#                        firm is shown with a "check directly" link
#
# domain: the firm's main website (used for its logo on the site)
#
# verified: true means the endpoint was matched against real posting URLs
# when this list was built. Unverified ones are flagged in the site's
# "Sources" tab if they fail, so they can be fixed.

companies:

