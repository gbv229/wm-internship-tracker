name: Probe job boards
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests playwright && python -m playwright install --with-deps chromium
      - run: python tools/probe.py > probe.txt 2>&1 || true
      - run: |
          git config user.name "probe-bot"; git config user.email "probe@users.noreply.github.com"
          git checkout --orphan probe-out && git rm -rq --cached . && git add probe.txt && git commit -qm probe && git push -f origin probe-out
