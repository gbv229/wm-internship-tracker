name: Update internships

on:
  schedule:
    - cron: "*/30 * * * *"      # every 30 minutes (GitHub may start runs a few minutes late)
  workflow_dispatch:             # "Run workflow" button on the Actions tab
    inputs:
      browser:
        description: "Read page-only firms in a headless browser (auto = every 3 hours)"
        default: auto
        type: choice
        options: [auto, "on", "off"]
  push:
    branches: [main]
    paths: ["companies.yaml", "scraper/**", "site/**", ".github/workflows/**"]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # latest data, even if this run waited behind another one

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install headless browser
        run: python -m playwright install --with-deps chromium

      - name: Tests
        run: python -m pytest -q tests

      - name: Scrape careers sites
        id: scrape
        run: python -m scraper.run --browser "${{ github.event.inputs.browser || 'auto' }}"

      - name: Save changes
        run: |
          git config user.name  "internship-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/postings.json data/companies.json data/seen.json
          if git diff --cached --quiet; then
            echo "No changes in postings."
          else
            git commit -m "Update postings $(date -u +'%Y-%m-%d %H:%M') UTC"
            # if another run saved data meanwhile, keep this run's newer scrape
            git pull --rebase --autostash -X theirs origin main || { git rebase --abort; git pull --no-rebase -X ours origin main; }
            git push
          fi

      - name: Health check (opens or closes the "Tracker health" issue)
        if: always() && steps.scrape.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create tracker-health --color D93F0B --description "Opened by the update job" --force >/dev/null 2>&1 || true
          num=$(gh issue list --label tracker-health --state open --json number --jq '.[0].number')
          rc=0; python -m scraper.health data health.md || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "Health report couldn't be built; skipping."
          elif [ "$rc" -eq 0 ]; then
            if [ -n "$num" ]; then
              gh issue comment "$num" --body "Everything is working again as of $(date -u +'%Y-%m-%d %H:%M') UTC. Closing."
              gh issue close "$num"
            fi
          else
            if [ -n "$num" ]; then
              gh issue edit "$num" --title "Tracker health: something needs attention" --body-file health.md
            else
              gh issue create --title "Tracker health: something needs attention" --label tracker-health --body-file health.md
            fi
          fi

      - name: Report a failed run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create tracker-health --color D93F0B --force >/dev/null 2>&1 || true
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          num=$(gh issue list --label tracker-health --state open --json number --jq '.[0].number')
          msg="The update run failed at $(date -u +'%Y-%m-%d %H:%M') UTC, so the site wasn't refreshed. Log: $url"
          if [ -n "$num" ]; then gh issue comment "$num" --body "$msg"; else gh issue create --title "Tracker health: update run failed" --label tracker-health --body "$msg"; fi

      - name: Build site
        run: |
          mkdir -p _site/data
          cp site/* _site/
          cp data/*.json _site/data/
          cp data/*.ics data/*.xml _site/data/ 2>/dev/null || true

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
